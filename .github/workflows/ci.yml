name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

# Cancel superseded runs for the same branch — saves minutes when pushing fast.
concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    lint-and-typecheck:
        name: Lint + typecheck
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
                  cache: pip

            - name: Install dev tooling
              run: |
                  python -m pip install --upgrade pip
                  pip install ruff mypy types-requests

            - name: Ruff (format + lint)
              run: |
                  ruff format --check .
                  ruff check .

            - name: Mypy
              # Type-check only our own code. Skipping `tests` here keeps the
              # signal high — pytest fixtures often need looser typing.
              run: mypy app

    test:
        name: Tests · Python ${{ matrix.python-version }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                # Three versions to ensure forward + backward compat. Drop 3.10
                # when EOL (Oct 2026).
                python-version: ["3.10", "3.11", "3.12"]
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-python@v5
              with:
                  python-version: ${{ matrix.python-version }}
                  cache: pip

            - name: Install runtime + dev deps (CPU torch only)
              # CPU-only torch keeps CI install <2min instead of ~10min for
              # the default wheel that ships CUDA libs.
              run: |
                  python -m pip install --upgrade pip
                  pip install --index-url https://download.pytorch.org/whl/cpu \
                      "torch>=2.6,<3.0" "torchaudio>=2.6,<3.0"
                  pip install -e ".[dev]"

            - name: Run pytest
              run: pytest --cov=app --cov-report=term-missing --cov-report=xml

            - name: Upload coverage
              if: matrix.python-version == '3.12'
              uses: actions/upload-artifact@v4
              with:
                  name: coverage-xml
                  path: coverage.xml
                  if-no-files-found: warn

    docker-build:
        name: Docker build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: docker/setup-buildx-action@v3

            - name: Build image (no push)
              uses: docker/build-push-action@v6
              with:
                  context: .
                  push: false
                  load: true
                  tags: transcriptor:ci
                  # Layer caching across runs reduces the slow torch install.
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            - name: Smoke-test image
              # Boot the container, wait for healthcheck, then tear down.
              # Catches startup regressions (missing deps, broken imports).
              run: |
                  docker run -d --name tx -p 8765:8765 transcriptor:ci
                  for i in {1..30}; do
                      if curl -fs http://localhost:8765/api/health > /dev/null; then
                          echo "Healthy after ${i}s"
                          exit 0
                      fi
                      sleep 1
                  done
                  echo "Container never became healthy — dumping logs:"
                  docker logs tx
                  exit 1

            - name: Teardown
              if: always()
              run: docker rm -f tx || true
