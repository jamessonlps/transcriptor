name: Bug report
description: Something doesn't work the way it should.
labels: [bug, triage]
body:
    - type: markdown
      attributes:
          value: |
              Thanks for taking the time to report a bug! The more detail you
              provide, the easier it is to reproduce and fix.
    - type: textarea
      id: what
      attributes:
          label: What happened?
          description: A clear description of the bug.
      validations:
          required: true
    - type: textarea
      id: steps
      attributes:
          label: Steps to reproduce
          placeholder: |
              1. Open http://localhost:8765
              2. Drop file X
              3. ...
      validations:
          required: true
    - type: textarea
      id: expected
      attributes:
          label: Expected behaviour
    - type: dropdown
      id: install-mode
      attributes:
          label: How are you running Transcriptor?
          options:
              - "run.sh (local virtualenv)"
              - "Docker / docker-compose"
              - "Installed app (.app / .desktop / Windows shortcut)"
      validations:
          required: true
    - type: input
      id: version
      attributes:
          label: Transcriptor version
          description: From Settings → About, or `git rev-parse HEAD`.
    - type: input
      id: os
      attributes:
          label: OS and version
          placeholder: macOS 14.5, Ubuntu 22.04, Windows 11...
    - type: textarea
      id: logs
      attributes:
          label: Relevant logs
          description: Paste server logs from the terminal or `docker compose logs`.
          render: shell
