<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0b0f" />
    <title>Transcriptor — Transcrição local em pt-br</title>

    <script src="/static/tailwind.js"></script>
    <link rel="stylesheet" href="/static/style.css" />
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        mono: ['JetBrains Mono', 'ui-monospace', 'monospace'],
                    },
                    colors: {
                        ink: {
                            950: '#06070b',
                            900: '#0a0b0f',
                            800: '#10131a',
                            700: '#161a24',
                            600: '#1f2533',
                            500: '#2a3142',
                        },
                        accent: {
                            300: '#c4b5fd',
                            400: '#a78bfa',
                            500: '#8b5cf6',
                            600: '#7c3aed',
                        },
                    },
                },
            },
        };
    </script>
</head>

<body class="min-h-screen bg-ink-950 text-slate-100 font-sans antialiased">
    <div class="bg-gradient" aria-hidden="true"></div>

    <!-- Top navigation -->
    <header class="topnav">
        <a href="#/" class="brand" data-route="/">
            <span class="brand-mark">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z" />
                    <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
                    <line x1="12" y1="19" x2="12" y2="23" />
                    <line x1="8" y1="23" x2="16" y2="23" />
                </svg>
            </span>
            <span class="brand-text">
                <span class="brand-name">Transcriptor</span>
                <span class="brand-sub">local · pt-br · 100% offline</span>
            </span>
        </a>

        <nav class="navtabs" aria-label="Navegação principal">
            <a href="#/" class="navtab" data-route="/">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z" />
                    <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
                </svg>
                <span>Transcrever</span>
            </a>
            <a href="#/settings" class="navtab" data-route="/settings">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="3" />
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z" />
                </svg>
                <span>Configurações</span>
            </a>
        </nav>
    </header>

    <main id="app" class="appshell">
        <div class="page-loading">
            <div class="spinner"></div>
        </div>
    </main>

    <footer class="footnote">
        Transcriptor <span class="text-slate-700">·</span> <span data-el="footer-year"></span>
    </footer>

    <!-- Toast container -->
    <div id="toast-stack" class="toast-stack" aria-live="polite"></div>

    <!-- Modal container (in-app dialogs) -->
    <div id="modal-root"></div>

    <!-- ===================== Templates ===================== -->

    <template id="tpl-transcribe">
        <!-- ETAPA 1: Upload -->
        <section data-step="upload" class="space-y-5 sm:space-y-6">
            <div class="text-center space-y-2 sm:space-y-3 py-4 sm:py-8">
                <h2 class="hero-heading">
                    Transforme seus áudios e vídeos em
                    <span class="bg-gradient-to-r from-accent-400 to-fuchsia-400 bg-clip-text text-transparent">texto</span>
                </h2>
                <p class="text-sm sm:text-base text-slate-400 max-w-xl mx-auto">
                    Arraste um vídeo ou áudio. Tudo roda localmente no seu computador — nada é enviado pra nuvem.
                </p>
            </div>

            <label data-el="dropzone" class="dropzone block">
                <input type="file" data-el="file-input" accept="video/*,audio/*" class="hidden" />
                <div class="dropzone-content">
                    <svg class="dropzone-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                        <polyline points="17 8 12 3 7 8" />
                        <line x1="12" y1="3" x2="12" y2="15" />
                    </svg>
                    <p class="text-base sm:text-lg font-semibold mb-1">Arraste seu arquivo aqui</p>
                    <p class="text-sm text-slate-400">ou <span class="text-accent-400 font-medium">clique para selecionar</span></p>
                    <p class="text-[11px] sm:text-xs text-slate-500 mt-3 px-2">.mp4 · .mov · .mkv · .mp3 · .wav · .m4a · .webm</p>
                </div>
            </label>

            <div class="space-y-3">
                <div class="section-header">
                    <h3 class="section-title">Modelo</h3>
                    <span class="section-hint">Maior = mais preciso, mais lento</span>
                </div>
                <div data-el="model-picker" class="model-grid"></div>
                <p class="text-[11px] sm:text-xs text-slate-500">
                    "~2x" significa que processa 2 segundos de áudio por segundo de CPU. Tempos reais variam.
                </p>
            </div>

            <div class="space-y-3">
                <div class="card p-4 flex items-center gap-3 sm:gap-4" data-el="diarize-card">
                    <label class="switch">
                        <input type="checkbox" data-el="diarize-toggle" />
                        <span class="slider"></span>
                    </label>
                    <div class="flex-1 min-w-0">
                        <p class="font-semibold text-sm">Identificar falantes</p>
                        <p data-el="diarize-help" class="text-xs text-slate-400">
                            Marca cada trecho com [Falante 1], [Falante 2]... Útil para reuniões.
                        </p>
                    </div>
                </div>
                <div data-el="num-speakers-box" class="card p-4 hidden">
                    <label class="block">
                        <span class="text-sm font-semibold">Quantos falantes? <span class="text-slate-500 font-normal">(opcional)</span></span>
                        <p class="text-xs text-slate-400 mt-0.5 mb-2">Deixe em branco para detecção automática. Informe se souber o número exato — melhora a precisão.</p>
                        <input type="number" data-el="num-speakers" min="1" max="20" placeholder="auto" class="num-input" />
                    </label>
                </div>
            </div>

            <div data-el="selected-file" class="hidden card p-4 sm:p-5 flex items-center gap-3 sm:gap-4">
                <div class="file-thumb">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="23 7 16 12 23 17 23 7" />
                        <rect x="1" y="5" width="15" height="14" rx="2" ry="2" />
                    </svg>
                </div>
                <div class="flex-1 min-w-0">
                    <p data-el="selected-name" class="font-medium truncate text-sm sm:text-base"></p>
                    <p data-el="selected-size" class="text-xs text-slate-400"></p>
                </div>
                <button data-el="clear-file" class="icon-btn" aria-label="Remover">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18" />
                        <line x1="6" y1="6" x2="18" y2="18" />
                    </svg>
                </button>
            </div>

            <button data-el="start-btn" class="btn-primary w-full" disabled>
                Iniciar transcrição
            </button>
        </section>

        <!-- ETAPA 2: Processamento + resultado -->
        <section data-step="result" class="hidden space-y-4 sm:space-y-5">
            <div class="card p-4 sm:p-5">
                <div class="flex items-center justify-between gap-3 sm:gap-4 flex-wrap">
                    <div class="flex items-center gap-3 min-w-0 flex-1">
                        <div data-el="status-icon" class="status-icon">
                            <div class="spinner"></div>
                        </div>
                        <div class="min-w-0">
                            <p data-el="status-text" class="font-semibold truncate text-sm sm:text-base">Carregando modelo…</p>
                            <p data-el="status-meta" class="text-xs text-slate-400 truncate"></p>
                        </div>
                    </div>
                    <button data-el="new-btn" class="btn-ghost shrink-0">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="12" y1="5" x2="12" y2="19" />
                            <line x1="5" y1="12" x2="19" y2="12" />
                        </svg>
                        Nova
                    </button>
                </div>
                <div class="mt-4">
                    <div class="progress-track">
                        <div data-el="progress-bar" class="progress-fill" style="width: 0%"></div>
                    </div>
                    <div class="flex justify-between mt-1.5 text-xs text-slate-500">
                        <span data-el="progress-current">0:00</span>
                        <span data-el="progress-total">--:--</span>
                    </div>
                </div>
            </div>

            <div data-el="speakers-bar" class="hidden card p-4">
                <div class="flex items-center justify-between gap-2 mb-3 flex-wrap">
                    <p class="text-sm font-semibold">Falantes detectados</p>
                    <p class="text-[11px] sm:text-xs text-slate-500">Clique no nome para renomear</p>
                </div>
                <div data-el="speakers-list" class="flex flex-wrap gap-2"></div>
            </div>

            <div data-el="actions" class="hidden actions-bar">
                <div class="actions-buttons">
                    <button data-el="copy-btn" class="btn-secondary">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="9" y="9" width="13" height="13" rx="2" ry="2" />
                            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
                        </svg>
                        <span data-el="copy-label">Copiar<span class="hidden sm:inline"> texto</span></span>
                    </button>
                    <a data-el="download-txt" class="btn-secondary" download>
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                            <polyline points="7 10 12 15 17 10" />
                            <line x1="12" y1="15" x2="12" y2="3" />
                        </svg>
                        <span class="hidden sm:inline">Baixar </span>.txt
                    </a>
                    <a data-el="download-srt" class="btn-secondary" download>
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                            <polyline points="7 10 12 15 17 10" />
                            <line x1="12" y1="15" x2="12" y2="3" />
                        </svg>
                        <span class="hidden sm:inline">Baixar </span>.srt
                    </a>
                </div>
                <div class="view-toggle-group">
                    <button class="view-toggle active" data-view="segments">Timestamps</button>
                    <button class="view-toggle" data-view="prose">Texto</button>
                </div>
            </div>

            <div data-el="transcript" class="card p-4 sm:p-6 min-h-[260px] sm:min-h-[300px]">
                <div data-el="transcript-empty" class="text-center text-slate-500 py-10 sm:py-12">
                    <div class="spinner mx-auto mb-3"></div>
                    Aguardando primeiros segmentos…
                </div>
                <div data-el="transcript-prose" class="prose-content hidden"></div>
                <div data-el="transcript-segments" class="hidden space-y-2"></div>
            </div>
        </section>

        <!-- ETAPA 3: Erro -->
        <section data-step="error" class="hidden card p-4 sm:p-6 border-red-500/40 bg-red-500/5">
            <div class="flex items-start gap-3">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-red-400 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10" />
                    <line x1="12" y1="8" x2="12" y2="12" />
                    <line x1="12" y1="16" x2="12.01" y2="16" />
                </svg>
                <div class="flex-1 min-w-0">
                    <p data-el="error-title" class="font-semibold text-red-300 mb-1">Algo deu errado</p>
                    <p data-el="error-text" class="text-sm text-slate-400 font-mono whitespace-pre-line break-words"></p>
                    <div class="flex flex-wrap gap-2 mt-3">
                        <a data-el="error-settings" href="#/settings" data-route="/settings" class="btn-primary hidden">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="12" r="3" />
                                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
                            </svg>
                            <span data-el="error-settings-label">Abrir Configurações</span>
                        </a>
                        <button data-el="error-retry" class="btn-ghost">Voltar</button>
                    </div>
                </div>
            </div>
        </section>
    </template>

    <template id="tpl-settings">
        <section class="space-y-6">
            <header class="space-y-2">
                <h2 class="text-2xl sm:text-3xl font-bold tracking-tight">Configurações</h2>
                <p class="text-sm text-slate-400">Gerencie os modelos baixados no seu disco.</p>
            </header>

            <!-- Storage overview card -->
            <div class="card p-5 sm:p-6">
                <div class="storage-row">
                    <div>
                        <p class="text-xs uppercase tracking-wider text-slate-500 font-semibold">Espaço usado pelos modelos</p>
                        <p data-el="storage-total" class="text-2xl sm:text-3xl font-bold mt-1 font-mono text-slate-100">—</p>
                        <p data-el="storage-path" class="text-[11px] text-slate-600 font-mono mt-1 break-all"></p>
                    </div>
                    <button data-el="refresh-btn" class="btn-ghost shrink-0">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="23 4 23 10 17 10" />
                            <polyline points="1 20 1 14 7 14" />
                            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15" />
                        </svg>
                        <span>Atualizar</span>
                    </button>
                </div>
            </div>

            <!-- Whisper models -->
            <section class="space-y-3">
                <div class="section-header">
                    <h3 class="section-title">Modelos de Transcrição</h3>
                    <span class="section-hint">Whisper — escolha o equilíbrio entre velocidade e precisão</span>
                </div>
                <div data-el="whisper-list" class="model-table">
                    <div class="model-table-skeleton">
                        <div class="spinner mx-auto"></div>
                    </div>
                </div>
            </section>

            <!-- Hugging Face token -->
            <section class="space-y-3">
                <div class="section-header">
                    <h3 class="section-title">Hugging Face</h3>
                    <span class="section-hint">Token de autenticação para download dos modelos</span>
                </div>
                <div data-el="hf-card" class="card hf-card">
                    <!-- Status row (header) -->
                    <div class="hf-status" data-el="hf-status-row">
                        <div data-el="hf-status-badge" class="hf-status-badge state-loading">
                            <div class="spinner"></div>
                        </div>
                        <div class="hf-status-text">
                            <p data-el="hf-status-title" class="hf-status-title">Verificando token…</p>
                            <p data-el="hf-status-detail" class="hf-status-detail">Consultando huggingface.co — geralmente leva 1 a 2 segundos.</p>
                        </div>
                        <button data-el="hf-toggle-edit" type="button" class="btn-ghost hidden">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" />
                                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z" />
                            </svg>
                            <span>Trocar</span>
                        </button>
                    </div>

                    <!-- Skeleton durante o whoami inicial: card nao fica "vazio" enquanto espera -->
                    <div data-el="hf-loading-skeleton" class="hf-loading-skeleton" aria-hidden="true">
                        <div class="hf-skeleton-row">
                            <span class="hf-skeleton-circle"></span>
                            <div class="hf-skeleton-text">
                                <span class="hf-skeleton-line" style="width: 55%"></span>
                                <span class="hf-skeleton-line short" style="width: 35%"></span>
                            </div>
                            <span class="hf-skeleton-pill"></span>
                        </div>
                        <div class="hf-skeleton-row">
                            <span class="hf-skeleton-circle"></span>
                            <div class="hf-skeleton-text">
                                <span class="hf-skeleton-line" style="width: 45%"></span>
                                <span class="hf-skeleton-line short" style="width: 28%"></span>
                            </div>
                            <span class="hf-skeleton-pill"></span>
                        </div>
                    </div>

                    <!-- Setup wizard (steps + input) -->
                    <div data-el="hf-wizard" class="hf-wizard hidden">
                        <ol class="hf-steps">
                            <li class="hf-step">
                                <span class="hf-step-num">1</span>
                                <div class="hf-step-body">
                                    <p class="hf-step-title">Crie sua conta no Hugging Face</p>
                                    <p class="hf-step-desc">
                                        É gratuita. Pule esta etapa se você já tem uma.
                                        <a href="https://huggingface.co/join" target="_blank" rel="noopener" class="link">Criar conta →</a>
                                    </p>
                                </div>
                            </li>
                            <li class="hf-step">
                                <span class="hf-step-num">2</span>
                                <div class="hf-step-body">
                                    <p class="hf-step-title">Gere um token de leitura</p>
                                    <p class="hf-step-desc">
                                        Vá em <a href="https://huggingface.co/settings/tokens" target="_blank" rel="noopener" class="link">huggingface.co/settings/tokens</a>,
                                        clique em <code>+ New token</code>, escolha o tipo <strong>Read</strong> e copie o token (começa com <code>hf_</code>).
                                    </p>
                                </div>
                            </li>
                            <li class="hf-step">
                                <span class="hf-step-num">3</span>
                                <div class="hf-step-body">
                                    <p class="hf-step-title">Aceite os termos dos modelos protegidos</p>
                                    <p class="hf-step-desc">
                                        Os modelos abaixo são <em>gated</em>: cada um exige um clique único em "Agree and access" usando a <strong>mesma conta</strong> do token. Sem isso o download falha mesmo com token válido.
                                    </p>
                                    <div data-el="hf-access-list-wizard" class="hf-access-list"></div>
                                </div>
                            </li>
                            <li class="hf-step">
                                <span class="hf-step-num">4</span>
                                <div class="hf-step-body">
                                    <p class="hf-step-title">Cole o token aqui</p>
                                    <div class="hf-input-row">
                                        <div class="hf-input-wrap">
                                            <input data-el="hf-input" type="password" autocomplete="off" spellcheck="false" placeholder="hf_xxxxxxxxxxxxxxxxxxxxxxxxx" class="hf-input" />
                                            <button data-el="hf-toggle-vis" type="button" class="hf-input-eye" aria-label="Mostrar/esconder token">
                                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                                                    <circle cx="12" cy="12" r="3" />
                                                </svg>
                                            </button>
                                        </div>
                                        <button data-el="hf-save" type="button" class="btn-primary hf-save" disabled>
                                            <span data-el="hf-save-label">Salvar token</span>
                                        </button>
                                    </div>
                                    <p data-el="hf-input-msg" class="hf-input-msg hidden"></p>
                                    <p class="hf-input-help">
                                        O token é salvo em <code data-el="hf-config-path">~/.cache/transcriptor/config.json</code> com permissão restrita ao seu usuário. Nada vai pra nuvem.
                                    </p>
                                </div>
                            </li>
                        </ol>
                        <button data-el="hf-cancel-edit" type="button" class="btn-ghost hf-cancel-edit hidden">Cancelar edição</button>
                    </div>

                    <!-- Access list (compact, when token is configured) -->
                    <div data-el="hf-access-section" class="hf-access-section hidden">
                        <div class="hf-access-header">
                            <p class="hf-access-title">Acesso aos modelos protegidos</p>
                            <button data-el="hf-recheck" type="button" class="btn-ghost">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <polyline points="23 4 23 10 17 10" />
                                    <polyline points="1 20 1 14 7 14" />
                                    <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15" />
                                </svg>
                                <span>Verificar de novo</span>
                            </button>
                        </div>
                        <div data-el="hf-access-list" class="hf-access-list"></div>
                    </div>

                    <!-- Remove token (footer, when configured) -->
                    <div data-el="hf-footer" class="hf-footer hidden">
                        <p class="hf-footer-meta">
                            <span data-el="hf-source-label" class="hf-source-pill"></span>
                            <span data-el="hf-masked" class="font-mono"></span>
                        </p>
                        <button data-el="hf-delete" type="button" class="btn-ghost danger">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="3 6 5 6 21 6" />
                                <path d="M19 6l-2 14a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L5 6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
                            </svg>
                            <span>Remover token</span>
                        </button>
                    </div>
                </div>
            </section>

            <!-- Diarization models -->
            <section class="space-y-3">
                <div class="section-header">
                    <h3 class="section-title">Identificação de Falantes</h3>
                    <span class="section-hint">PyAnnote — opcional, para reuniões e entrevistas</span>
                </div>
                <div data-el="diarization-list" class="model-table"></div>
                <div data-el="diarization-token-warn" class="hidden alert-warning">
                    <strong>Token Hugging Face não configurado.</strong>
                    Configure-o na seção acima para baixar os modelos de diarização.
                </div>
            </section>

            <!-- About / version -->
            <section class="card p-5 text-xs text-slate-500 space-y-1">
                <p><strong class="text-slate-400">Transcriptor</strong> · <span data-el="app-version">v0.2.0</span></p>
                <p>Modelos vivem em <code data-el="cache-dir" class="font-mono text-slate-400">—</code></p>
                <p>Para desinstalar o atalho do sistema, rode <code class="font-mono text-slate-400">./installer/uninstall.sh</code> (macOS/Linux) ou o <code class="font-mono text-slate-400">uninstall.ps1</code> no Windows.</p>
            </section>
        </section>
    </template>

    <!-- HF access row template (lista do wizard + da seção compacta) -->
    <template id="tpl-hf-access-row">
        <div class="hf-access-row" data-repo-id="">
            <div class="hf-access-info">
                <span data-el="state-icon" class="hf-access-icon"></span>
                <div class="hf-access-text">
                    <p data-el="label" class="hf-access-label"></p>
                    <p data-el="repo-id" class="hf-access-repo"></p>
                </div>
            </div>
            <div class="hf-access-actions">
                <span data-el="status" class="hf-access-status"></span>
                <a data-el="open-terms" target="_blank" rel="noopener" class="btn-secondary hf-access-link hidden">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" />
                        <polyline points="15 3 21 3 21 9" />
                        <line x1="10" y1="14" x2="21" y2="3" />
                    </svg>
                    <span>Aceitar termos</span>
                </a>
            </div>
        </div>
    </template>

    <!-- Model row template (usado pela settings view) -->
    <template id="tpl-model-row">
        <div class="model-row" data-key="">
            <div class="model-row-info">
                <div class="model-row-name">
                    <span data-el="label" class="model-row-label"></span>
                    <span data-el="tag" class="model-row-tag hidden"></span>
                </div>
                <p data-el="description" class="model-row-desc"></p>
                <div class="model-row-meta">
                    <span data-el="size" class="meta-pill"></span>
                    <span class="tooltip-wrap" data-tooltip="Velocidade aproximada de processamento. ~2x = o modelo transcreve 2 segundos de áudio por segundo de CPU. Tempos reais variam com o hardware.">
                        <span data-el="speed" class="meta-pill"></span>
                    </span>
                    <span data-el="status" class="meta-pill"></span>
                </div>
            </div>
            <div class="model-row-actions">
                <button data-el="download-btn" class="btn-secondary hidden">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                        <polyline points="7 10 12 15 17 10" />
                        <line x1="12" y1="15" x2="12" y2="3" />
                    </svg>
                    <span>Baixar</span>
                </button>
                <button data-el="cancel-btn" class="btn-secondary hidden">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18" />
                        <line x1="6" y1="6" x2="18" y2="18" />
                    </svg>
                    <span>Cancelar</span>
                </button>
                <button data-el="delete-btn" class="btn-secondary danger hidden">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="3 6 5 6 21 6" />
                        <path d="M19 6l-2 14a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L5 6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
                    </svg>
                    <span>Remover</span>
                </button>
            </div>
            <div data-el="progress" class="model-row-progress hidden">
                <div class="model-row-progress-bar">
                    <div data-el="progress-bar" class="model-row-progress-fill"></div>
                </div>
                <div class="model-row-progress-text">
                    <span data-el="progress-status">Baixando…</span>
                    <span data-el="progress-bytes" class="font-mono"></span>
                </div>
            </div>
        </div>
    </template>

    <script type="module" src="/static/js/main.js"></script>
</body>
</html>
