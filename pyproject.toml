[project]
name = "transcriptor"
version = "0.3.0"
description = "Local web app for transcribing video/audio in pt-br using faster-whisper. 100% offline."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "Jamesson Felipe" },
]
keywords = ["transcription", "whisper", "speech-to-text", "diarization", "local-first"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "faster-whisper>=1.0",
    "pyannote.audio>=4.0",
    "python-dotenv>=1.0",
    # torch/torchaudio acompanham a versão mais recente do pyannote 4.x
    "torch>=2.6",
    "torchaudio>=2.6",
    "huggingface_hub>=0.26",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",        # FastAPI TestClient
    "ruff>=0.6",
    "mypy>=1.10",
    "types-requests",
]
# Aceleração CUDA pra Whisper (Linux/Windows com GPU NVIDIA).
# Linux: pip install -e ".[gpu]" puxa cuBLAS + cuDNN via pip (sem precisar
# instalar o CUDA Toolkit do sistema). macOS NÃO é suportado: CTranslate2
# não tem backend Metal/MPS.
gpu = [
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12>=9",
]

[project.urls]
Homepage = "https://github.com/jamessonfelipe/transcriptor"
Repository = "https://github.com/jamessonfelipe/transcriptor"
Changelog = "https://github.com/jamessonfelipe/transcriptor/blob/main/CHANGELOG.md"
Issues = "https://github.com/jamessonfelipe/transcriptor/issues"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
filterwarnings = [
    # Silence pyannote/torchaudio deprecation noise unrelated to our code.
    "ignore::DeprecationWarning:pyannote.*",
    "ignore::UserWarning:torchaudio.*",
]
asyncio_mode = "auto"
